<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ისწავლე ჭადრაკი თამაშით: ფიგურების სვლები, ამოცანები და დროის გამოწვევა. უფასოდ, ქართულად." />
    <link rel="canonical" href="https://chess.lvlup.ge/" />
    <!-- The link preview. The image is drawn by scripts/og (node scripts/og/render.mjs) and
         must be an absolute URL: WhatsApp will not follow a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chess.lvlup.ge/" />
    <meta property="og:site_name" content="LevelUp Georgia" />
    <meta property="og:title" content="ჭადრაკი · LevelUp Georgia" />
    <meta property="og:description" content="ჭადრაკის უფასო გაკვეთილები და ამოცანები ქართულად. Free chess lessons and puzzles in Georgian." />
    <meta property="og:image" content="https://chess.lvlup.ge/og/card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ჭადრაკი: უფასო გაკვეთილები და ამოცანები ქართულად" />
    <meta property="og:locale" content="ka_GE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>ჭადრაკი · LevelUp Georgia</title>
  </head>
  <body>
    <script>
      // a theme chosen in the header, applied before the first paint
      try {
        var saved = JSON.parse(localStorage.getItem('kai-chess:v1') || '{}')
        if (saved.theme === 'light' || saved.theme === 'dark') document.documentElement.dataset.theme = saved.theme
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
