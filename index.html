<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ისწავლე ჭადრაკი თამაშით: ფიგურების სვლები, ამოცანები და სწრაფი რაუნდი. უფასოდ, ქართულად." />
    <meta name="theme-color" content="#1d4ed8" />
    <title>ჭადრაკი · LevelUp Georgia</title>
  </head>
  <body>
    <script>
      // a theme chosen in the header, applied before the first paint
      try {
        var saved = JSON.parse(localStorage.getItem('kai-chess:v1') || '{}')
        if (saved.theme === 'light' || saved.theme === 'dark') document.documentElement.dataset.theme = saved.theme
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
